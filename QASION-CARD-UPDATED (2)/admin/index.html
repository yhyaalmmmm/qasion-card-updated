<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>QASION CARD — لوحة الإدارة</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
:root{--bg:#0a1424;--panel:#101e33;--panel2:#0c1829;--line:#1f3354;--text:#e8eef7;--muted:#8da2bd;--gold:#c9a15a;--gold2:#ecd29b;--blue:#4aa3ff;--ok:#2fd29a;--warn:#f2b441;--danger:#ff6b81;--r:14px}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.muted{color:var(--muted)}.small{font-size:12px}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--danger)}.gold{color:var(--gold2)}
.ltr{direction:ltr;unicode-bidi:embed;text-align:left}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(1200px 600px at 80% -10%,#1a2f52 0,transparent 60%),radial-gradient(900px 500px at 0 110%,#2a2415 0,transparent 55%),var(--bg)}
.lbox{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 30px 80px #0009}
.lbox img.logo{display:block;margin:0 auto 6px;max-height:130px;max-width:100%;object-fit:contain}
.lbox h1{font-size:18px;text-align:center;margin:4px 0 2px}
.lbox p.sub{text-align:center;color:var(--muted);margin:0 0 14px;font-size:13px}
/* forms */
label.f{display:block;margin:12px 0 0}label.f>span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
input[type=text],input[type=password],input[type=number],input[type=url],input[type=search],input[type=email],select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
input:disabled,select:disabled{opacity:.55}
textarea{resize:vertical;min-height:80px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:14px 50%,19px 50%;background-size:5px 5px;background-repeat:no-repeat;padding-left:34px}
.chk{display:flex;gap:8px;align-items:center;cursor:pointer}.chk input{width:17px;height:17px;accent-color:var(--gold)}
.btn{text-decoration:none;border:1px solid var(--line);background:#14284a;color:var(--text);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:700;display:inline-flex;gap:7px;align-items:center;justify-content:center;transition:.15s;white-space:nowrap}
.btn:hover{border-color:#34507d;background:#183257}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,#d6ad62,#a9803a);border-color:#c9a15a;color:#1b1204}.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:#3a1521;border-color:#6d2236;color:#ffc2cf}.btn.danger:hover{background:#4b1a2a}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}.btn.block{width:100%}
.err{color:var(--danger);font-size:13px;margin-top:10px;min-height:18px}
/* layout */
#app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{background:var(--panel2);border-left:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
aside .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
aside .brand img{width:44px;height:44px;object-fit:contain}aside .brand b{display:block;font-size:15px}aside .brand small{color:var(--muted)}
nav{display:grid;gap:3px;flex:1;align-content:start}
nav button{display:flex;gap:10px;align-items:center;width:100%;text-align:right;background:transparent;border:0;color:#c9d6e8;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:14px}
nav button:hover{background:#12274a}nav button.on{background:linear-gradient(90deg,#2a2111,#16253f);color:var(--gold2);box-shadow:inset -3px 0 0 var(--gold)}
nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav .cnt{margin-right:auto;background:var(--danger);color:#fff;border-radius:999px;padding:0 7px;font-size:11px;font-weight:800;min-width:20px;text-align:center}
.me{border-top:1px solid var(--line);padding-top:12px;margin-top:10px}
.me .who{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#17315a;color:#9fd0ff;border:1px solid #28508a}
.badge.ok{background:#0d3a2c;color:#6ff0c0;border-color:#1a6a50}.badge.warn{background:#3b2d0c;color:#ffd27a;border-color:#6d5217}.badge.bad{background:#401624;color:#ff9fb2;border-color:#7a2639}.badge.gray{background:#1a2a44;color:#9db1cf;border-color:#2a3f63}
main{padding:22px 26px;min-width:0}
.top{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.top h1{margin:0;font-size:22px}.top .acts{display:flex;gap:8px;flex-wrap:wrap}
#menuBtn{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h3{margin:0 0 12px;font-size:15px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.stat{display:flex;gap:12px;align-items:center}
.stat .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#1a2c4d;flex:none}.stat .ic svg{width:22px;height:22px;stroke:var(--gold2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stat b{font-size:24px;display:block;line-height:1.1}.stat span{color:var(--muted);font-size:12px}
.alert{border-radius:12px;padding:12px 14px;margin-bottom:12px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid}
.alert.warn{background:#2c2208;border-color:#6d5217;color:#ffe2a1}.alert.info{background:#0d2340;border-color:#25508a;color:#bcdcff}.alert.bad{background:#34121d;border-color:#7a2639;color:#ffc2cf}
/* tables */
.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid #182b49;vertical-align:middle}
th{background:#0d1a2e;color:var(--muted);font-size:12px;font-weight:700;position:sticky;top:0}
tbody tr:hover{background:#12223c}tbody tr:last-child td{border-bottom:0}
td .thumb{width:42px;height:42px;border-radius:9px;object-fit:cover;background:#0b1424;border:1px solid var(--line)}
td.acts{white-space:nowrap}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1;min-width:180px}.toolbar input,.toolbar select{width:auto;min-width:140px}.toolbar .grow input{width:100%}
.bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#1c2a12;border:1px solid #4a6a20;border-radius:12px;padding:8px 12px;margin-bottom:12px}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px;color:var(--muted)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:6px}
/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tabs button{background:transparent;border:0;color:var(--muted);padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;font-weight:700}
.tabs button.on{color:var(--gold2);border-color:var(--gold)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
/* modal */
.mback{position:fixed;inset:0;background:#030811c8;display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:min(760px,100%);max-height:94vh;display:flex;flex-direction:column;box-shadow:0 30px 90px #000a}
.modal.sm{width:min(440px,100%)}
.mh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}.mh h3{margin:0;font-size:16px}
.mb{padding:16px 18px;overflow:auto}.mf{display:flex;gap:8px;justify-content:flex-start;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{background:transparent;border:0;color:var(--muted);font-size:20px;cursor:pointer;line-height:1}
.fld{display:grid;grid-template-columns:1.2fr 1.2fr .8fr auto auto;gap:6px;align-items:center;margin-bottom:6px}
.imgrow{display:flex;gap:10px;align-items:center}.imgrow img{width:64px;height:64px;border-radius:10px;object-fit:cover;border:1px solid var(--line);background:#0b1424}
.banner{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--panel2)}
.banner img{width:150px;aspect-ratio:1408/768;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.hist{border-right:2px solid var(--line);padding-right:12px;margin:8px 0}.hist div{margin-bottom:6px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px}.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word}
.bars{display:flex;gap:10px;align-items:flex-end;height:140px;padding-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%}
.bars i{display:block;width:100%;max-width:46px;background:linear-gradient(180deg,var(--gold2),#8a6628);border-radius:7px 7px 2px 2px;min-height:3px}
.bars span{font-size:11px;color:var(--muted)}.bars b{font-size:12px}
.chk-list{display:grid;gap:8px}.chk-list .it{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:9px 0;border-bottom:1px solid #182b49}.chk-list .it:last-child{border:0}
#toasts{position:fixed;bottom:18px;left:18px;display:grid;gap:8px;z-index:99}
.toast{background:#13294b;border:1px solid #2c548f;border-right:4px solid var(--blue);padding:10px 16px;border-radius:10px;box-shadow:0 10px 30px #0008;max-width:360px}
.toast.ok{border-right-color:var(--ok)}.toast.bad{border-right-color:var(--danger)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #fff4;border-top-color:var(--gold2);border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.loading{padding:50px;text-align:center;color:var(--muted)}
@media(max-width:900px){#app{grid-template-columns:1fr}aside{position:fixed;inset:0 0 0 auto;width:270px;height:100vh;transform:translateX(100%);transition:.2s;z-index:40;box-shadow:-20px 0 60px #000a}aside.open{transform:none}#menuBtn{display:inline-flex}main{padding:14px}.row2,.row3{grid-template-columns:1fr}.fld{grid-template-columns:1fr 1fr}.banner{grid-template-columns:1fr}.banner img{width:100%}}
</style>
</head>
<body>

<div id="login">
  <form class="lbox" id="loginForm" autocomplete="on">
    <img class="logo" src="/site-logo-full.png" alt="QASION CARD">
    <h1>لوحة الإدارة</h1>
    <p class="sub">الدخول للمخوّلين فقط — كل العمليات تُسجَّل</p>
    <label class="f"><span>نوع الحساب</span><select id="lRole"><option value="main">الإدارة الرئيسية</option><option value="support">الدعم</option></select></label>
    <label class="f"><span>اسم المستخدم</span><input id="lUser" type="text" autocomplete="username" required></label>
    <label class="f"><span>كلمة السر</span><input id="lPass" type="password" autocomplete="current-password" required></label>
    <label class="f" id="lDevWrap" hidden><span>اسم هذا الجهاز (للدعم)</span><input id="lDev" type="text" maxlength="60" placeholder="مثال: لابتوب المكتب"></label>
    <button class="btn primary block" id="lBtn" style="margin-top:16px" type="submit">دخول</button>
    <div class="err" id="lErr" role="alert"></div>
  </form>
</div>

<div id="app" hidden>
  <aside id="side">
    <div class="brand"><img src="/site-logo.png" alt=""><div><b>QASION CARD</b><small>لوحة الإدارة</small></div></div>
    <nav id="nav"></nav>
    <div class="me">
      <div class="who"><span id="meName"></span><span class="badge" id="meRole"></span></div>
      <button class="btn danger block sm" data-act="logout">تسجيل الخروج</button>
    </div>
  </aside>
  <main>
    <div class="top">
      <div style="display:flex;gap:10px;align-items:center"><button class="btn" id="menuBtn" data-act="menu" aria-label="القائمة">☰</button><h1 id="title"></h1></div>
      <div class="acts" id="topActs"></div>
    </div>
    <div id="content"><div class="loading"><span class="spin"></span></div></div>
  </main>
</div>
<div id="modalRoot"></div>
<div id="toasts" aria-live="polite"></div>

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
const NF = new Intl.NumberFormat('en-US', { maximumFractionDigits: 4 });
const money = (n, c) => (n === null || n === undefined || n === '' ? '—' : NF.format(Number(n)) + ' ' + (c || 'USD'));
const dt = iso => { if (!iso) return '—'; const d = new Date(iso); return isNaN(d) ? '—' : d.toLocaleString('ar-u-nu-latn', { dateStyle: 'medium', timeStyle: 'short' }); };
const ST = { pending: ['قيد المراجعة', 'warn'], processing: ['قيد التنفيذ', ''], completed: ['مكتمل', 'ok'], rejected: ['مرفوض', 'bad'], failed: ['فشل', 'bad'], cancelled: ['ملغي', 'gray'] };
const badge = (s) => { const [t, c] = ST[s] || [s, 'gray']; return `<span class="badge ${c}">${esc(t)}</span>`; };
const ICONS = {
  dash: '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
  box: '<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>',
  cart: '<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a1 1 0 0 0 1 .8h8.8a1 1 0 0 0 1-.8L20 8H6"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.5 3.2-5.5 6.5-5.5s5.9 2 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.7c1.7.8 2.7 2.5 3 5.3"/>',
  wallet: '<path d="M3 7a2 2 0 0 1 2-2h13v4"/><path d="M3 7v11a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2z"/><circle cx="16.5" cy="14.5" r="1"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  plug: '<path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 0 1-12 0V8zM12 18v4"/>',
  phone: '<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',
  log: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h6"/>'
};
const icon = n => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
const SECTIONS = [
  ['dashboard', 'لوحة المعلومات', 'dash', 'dashboard'], ['products', 'المنتجات', 'box', 'products.read'], ['orders', 'الطلبات', 'cart', 'orders.read'],
  ['users', 'المستخدمون', 'users', 'users.read'], ['deposits', 'الإيداعات', 'wallet', 'main'], ['settings', 'إعدادات الموقع', 'gear', 'settings.read'],
  ['providers', 'المزوّدون', 'plug', 'providers.read'], ['devices', 'أجهزة الدعم', 'phone', 'main'], ['audit', 'سجل النشاط', 'log', 'main']
];

const S = { session: null, meta: null, section: 'dashboard', pendingCount: 0,
  prod: { page: 1, q: '', category: '', active: '', source: '', selected: new Set() }, ord: { page: 1, q: '', status: '' }, usr: { page: 1, q: '' }, aud: { page: 1, q: '' }, setTab: 'general' };

async function api(path, o = {}) {
  const r = await fetch(path, { method: o.method || 'GET', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: o.body !== undefined ? JSON.stringify(o.body) : undefined });
  const ct = r.headers.get('content-type') || '';
  if (!ct.includes('json')) { if (r.ok) return r; throw Object.assign(new Error('استجابة غير متوقعة'), { status: r.status }); }
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && S.session && !path.endsWith('/auth')) { toast('انتهت الجلسة، سجّل الدخول من جديد', 'bad'); setTimeout(() => location.reload(), 900); }
  if (!r.ok) throw Object.assign(new Error(d.error || d.message || 'حدث خطأ'), { status: r.status, data: d });
  return d;
}
function toast(msg, kind = '') { const t = document.createElement('div'); t.className = 'toast ' + kind; t.textContent = msg; $('#toasts').appendChild(t); setTimeout(() => t.remove(), kind === 'bad' ? 6000 : 3200); }
const can = p => p === 'main' ? S.session.role === 'main' : (S.session.role === 'main' || S.meta.perms.includes(p));

/* ---------- نوافذ ---------- */
function openModal(title, bodyHtml, footHtml, size) {
  closeModal();
  const m = document.createElement('div'); m.className = 'mback'; m.id = 'modal';
  m.innerHTML = `<div class="modal ${size || ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="mh"><h3>${esc(title)}</h3><button class="x" data-act="closeModal" aria-label="إغلاق">×</button></div><div class="mb">${bodyHtml}</div>${footHtml ? `<div class="mf">${footHtml}</div>` : ''}</div>`;
  m.addEventListener('mousedown', e => { if (e.target === m) closeModal(); });
  $('#modalRoot').appendChild(m); const f = m.querySelector('input:not([type=checkbox]),select,textarea'); if (f) f.focus(); return m;
}
function closeModal() { $('#modalRoot').innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
function confirmBox(msg, okText = 'تأكيد', danger = true) {
  return new Promise(res => {
    const m = openModal('تأكيد العملية', `<p style="margin:0">${esc(msg)}</p>`, `<button class="btn ${danger ? 'danger' : 'primary'}" id="cOk">${esc(okText)}</button><button class="btn" id="cNo">إلغاء</button>`, 'sm');
    m.querySelector('#cOk').onclick = () => { closeModal(); res(true); }; m.querySelector('#cNo').onclick = () => { closeModal(); res(false); };
  });
}
function promptBox(title, label, value = '') {
  return new Promise(res => {
    const m = openModal(title, `<label class="f" style="margin:0"><span>${esc(label)}</span><input id="pIn" type="text" value="${esc(value)}"></label>`, `<button class="btn primary" id="pOk">موافق</button><button class="btn" id="pNo">إلغاء</button>`, 'sm');
    const done = v => { closeModal(); res(v); };
    m.querySelector('#pOk').onclick = () => done(m.querySelector('#pIn').value); m.querySelector('#pNo').onclick = () => done(null);
    m.querySelector('#pIn').addEventListener('keydown', e => { if (e.key === 'Enter') done(m.querySelector('#pIn').value); });
  });
}
async function busy(btn, fn) { const t = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>'; try { return await fn(); } finally { btn.disabled = false; btn.innerHTML = t; } }
function pager(info, key) {
  if (!info || info.pages <= 1) return info ? `<div class="pager small">${info.total} نتيجة</div>` : '';
  return `<div class="pager"><button class="btn sm" data-act="page" data-key="${key}" data-p="${info.page - 1}" ${info.page <= 1 ? 'disabled' : ''}>السابق</button><span>صفحة ${info.page} من ${info.pages} — ${info.total} نتيجة</span><button class="btn sm" data-act="page" data-key="${key}" data-p="${info.page + 1}" ${info.page >= info.pages ? 'disabled' : ''}>التالي</button></div>`;
}
const catName = k => (S.meta.categories.find(c => c.key === k) || {}).name || k;
const catOptions = (sel, all) => (all ? `<option value="">كل الأقسام</option>` : '') + S.meta.categories.map(c => `<option value="${esc(c.key)}" ${c.key === sel ? 'selected' : ''}>${esc(c.name)}</option>`).join('');

function deviceId() { let d = localStorage.getItem('qc_admin_device'); if (!d || d.length < 32) { d = crypto.randomUUID() + crypto.randomUUID(); localStorage.setItem('qc_admin_device', d); } return d; }
$('#lRole').addEventListener('change', e => { $('#lDevWrap').hidden = e.target.value !== 'support'; });
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault(); const err = $('#lErr'); err.textContent = '';
  await busy($('#lBtn'), async () => {
    try {
      const d = await api('/api/admin/auth', { method: 'POST', body: { action: 'login', role: $('#lRole').value, username: $('#lUser').value, password: $('#lPass').value, deviceId: deviceId(), deviceLabel: $('#lDev').value } });
      $('#lPass').value = ''; await start(d.session);

      if (ex.data?.deviceId) err.innerHTML = esc(ex.message) + `<br><span class="small muted">معرّف الجهاز (أعطه للإدارة):</span><br><code class="ltr small" style="word-break:break-all;user-select:all">${esc(ex.data.deviceId)}</code>`;
    }

async function start(session) {
  S.session = session; S.meta = await api('/api/admin/meta');

  $('#meName').textContent = session.username; const rb = $('#meRole'); rb.textContent = session.role === 'main' ? 'رئيسي' : 'دعم'; rb.className = 'badge ' + (session.role === 'main' ? 'ok' : '');
  const h = (location.hash || '').slice(1); S.section = SECTIONS.some(s => s[0] === h) ? h : 'dashboard';

function renderNav() {

async function refreshPending() { try { if (!can('orders.read')) return; const d = await api('/api/admin/orders?status=pending&limit=1'); S.pendingCount = d.total; renderNav(); } catch {} }
function go(id) {
  const sec = SECTIONS.find(s => s[0] === id && can(s[3])) || SECTIONS[0]; S.section = sec[0]; location.hash = sec[0];
  $('#title').textContent = sec[1]; $('#topActs').innerHTML = ''; $('#side').classList.remove('open'); renderNav();

  if (o.byStatus.pending) alerts += `<div class="alert warn"><span>لديك <b>${o.byStatus.pending}</b> طلب بانتظار المراجعة.</span><button class="btn sm" data-act="ordersPending">مراجعة الطلبات</button></div>`;
  if (d.ordersMode === 'auto') alerts += `<div class="alert bad"><span><b>تنبيه:</b> وضع التنفيذ التلقائي فعّال — الطلبات ترسل للمزوّد فوراً ولا يوجد خصم رصيد تلقائي من محفظة الزبون. الأفضل وضع «مراجعة الإدارة» لحين ربط الدفع.</span></div>`;
  if (d.maintenance) alerts += `<div class="alert warn"><span>وضع الصيانة <b>مفعّل</b>: الزبائن لا يستطيعون الطلب حالياً.</span><button class="btn sm" data-act="nav" data-s="settings">إيقافه</button></div>`;

  const stats = [['box', p.active + ' / ' + p.total, 'منتج فعّال / الكلي'], ['cart', o.today, 'طلبات اليوم'], ['log', o.byStatus.pending, 'بانتظار المراجعة'], ['wallet', money(o.revenueUSD, 'USD'), 'مبيعات مكتملة (USD)']];

    <div class="card"><h3>المنتجات</h3>
      <dl class="kv"><dt>يدوية</dt><dd>${p.manual}</dd><dt>من المزوّدين</dt><dd>${p.provider}</dd><dt>مخفية</dt><dd>${p.hidden}</dd><dt>بدون صورة</dt><dd>${p.noImage}</dd></dl>

  $('#content').innerHTML = `<div class="alert info"><span>حساب الدعم لا يدخل إلا من جهاز مفعّل (الحد الأقصى ${d.max}). عندما يحاول الدعم الدخول من جهاز جديد يظهر له «معرّف الجهاز»، الصقه هنا للتفعيل.</span></div>
  <div class="card" style="margin-bottom:14px"><div class="row2"><label class="f" style="margin-top:0"><span>معرّف الجهاز</span><input type="text" id="dId" class="ltr"></label><label class="f" style="margin-top:0"><span>اسم الجهاز</span><input type="text" id="dLbl" maxlength="60"></label></div><button class="btn primary" style="margin-top:12px" data-act="devApprove">تفعيل الجهاز</button></div>
  ${d.devices.length ? `<div class="tw"><table><thead><tr><th>الاسم</th><th>المعرّف</th><th>الحالة</th><th>آخر دخول</th><th></th></tr></thead><tbody>${d.devices.map(x => `<tr><td>${esc(x.label || '—')}</td><td class="ltr small">${esc(x.device_id.slice(0, 18))}…</td><td>${x.approved ? '<span class="badge ok">مفعّل</span>' : '<span class="badge warn">بانتظار التفعيل</span>'}</td><td class="small">${dt(x.last_login)}</td><td class="acts">${x.approved ? '' : `<button class="btn sm" data-act="devApproveRow" data-id="${esc(x.device_id)}" data-l="${esc(x.label || '')}">تفعيل</button> `}<button class="btn sm danger" data-act="devRevoke" data-id="${esc(x.device_id)}">إلغاء</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="card empty"><b>لا أجهزة مسجّلة</b></div>'}`;
}
async function vAudit() {
  const A = S.aud; const d = await api('/api/admin/audit?' + new URLSearchParams({ page: A.page, q: A.q, limit: 50 }));
  $('#content').innerHTML = `<div class="toolbar"><div class="grow"><input type="search" id="aq" placeholder="بحث بالمستخدم أو الإجراء…" value="${esc(A.q)}"></div></div>${d.items.length ? `<div class="tw"><table><thead><tr><th>الوقت</th><th>المستخدم</th><th>الإجراء</th><th>التفاصيل</th><th>IP</th></tr></thead><tbody>${d.items.map(a => `<tr><td class="small">${dt(a.at)}</td><td>${esc(a.user)} <span class="badge gray">${esc(a.role)}</span></td><td class="ltr small"><b>${esc(a.action)}</b></td><td class="small">${esc(a.detail)}</td><td class="ltr small">${esc(a.ip)}</td></tr>`).join('')}</tbody></table></div>${pager(d, 'aud')}` : '<div class="card empty"><b>السجل فارغ</b></div>'}`;
  let t; $('#aq').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => { A.q = e.target.value; A.page = 1; vAudit(); }, 350); });
}

/* ---------- الأحداث ---------- */
const ACT = {
  nav: b => go(b.dataset.s), menu: () => $('#side').classList.toggle('open'), reload: () => go(S.section), closeModal,
  logout: async () => { try { await api('/api/admin/auth', { method: 'POST', body: { action: 'logout' } }); } catch {} location.reload(); },
  page: b => { const k = b.dataset.key, p = +b.dataset.p; if (k === 'prod') { S.prod.page = p; vProducts(); } if (k === 'ord') { S.ord.page = p; vOrders(); } if (k === 'usr') { S.usr.page = p; vUsers(); } if (k === 'aud') { S.aud.page = p; vAudit(); } },
  ordersPending: () => { S.ord.status = 'pending'; S.ord.page = 1; go('orders'); },
  prodNew: () => productForm(null), prodEdit: b => productForm(S.prodItems.find(p => p.id === b.dataset.id)), prodImport: importForm,
  prodSync: b => syncProviders(b),
  prodToggle: async b => { const p = S.prodItems.find(x => x.id === b.dataset.id); try { await api('/api/admin/products/' + p.id, { method: 'PUT', body: { active: !p.active } }); toast(p.active ? 'تم الإخفاء' : 'تم الإظهار', 'ok'); vProducts(); } catch (ex) { toast(ex.message, 'bad'); } },
  prodDel: async b => { const p = S.prodItems.find(x => x.id === b.dataset.id); if (!await confirmBox(`حذف «${p.name}» نهائياً؟ لا يمكن التراجع.`, 'حذف')) return; try { await api('/api/admin/products/' + p.id, { method: 'DELETE' }); S.prod.selected.delete(p.id); toast('تم الحذف', 'ok'); vProducts(); } catch (ex) { toast(ex.message, 'bad'); } },
  bulkClear: () => { S.prod.selected.clear(); vProducts(); },
  bulk: async b => {
    const a = b.dataset.a, ids = [...S.prod.selected]; let value;
    if (a === 'delete' && !await confirmBox(`حذف ${ids.length} منتج نهائياً؟`, 'حذف')) return;
    if (a === 'reprice') { value = await promptBox('إعادة التسعير', 'هامش الربح % (يُطبَّق على المنتجات التي لها سعر تكلفة)', String(S.margin ?? 3)); if (value === null) return; }
    try { const r = await api('/api/admin/products/bulk', { method: 'POST', body: { action: a, ids, value } }); toast(`تم على ${r.affected} منتج`, 'ok'); S.prod.selected.clear(); vProducts(); } catch (ex) { toast(ex.message, 'bad'); }
  },
  fldAdd: () => { const c = $('#flds'); if (c.children.length >= 8) return toast('الحد الأقصى 8 حقول', 'bad'); c.insertAdjacentHTML('beforeend', fieldRow({ type: 'text', required: true })); },
  fldDel: b => b.closest('.fld').remove(),
  orderOpen: b => orderModal(S.ordItems.find(o => o.id === b.dataset.id)),
  userBan: async b => { const ban = b.dataset.ban === '1'; if (!await confirmBox(ban ? 'إيقاف هذا الحساب؟ لن يستطيع تسجيل الدخول.' : 'رفع الإيقاف عن الحساب؟', ban ? 'إيقاف' : 'رفع الإيقاف', ban)) return; try { await api(`/api/admin/users/${b.dataset.id}/ban`, { method: 'POST', body: { ban } }); toast('تم', 'ok'); vUsers(); } catch (ex) { toast(ex.message, 'bad'); } },
  setTab: b => { S.setTab = b.dataset.t; renderSettings(); },
  banAdd: () => { if (S.set.banners.length >= 10) return toast('الحد الأقصى 10 بنرات', 'bad'); S.set.banners = collectBanners().map((x, i) => ({ ...x, id: S.set.banners[i]?.id })); S.set.banners.push({ id: 'n' + Date.now().toString(36), title: '', image: '/assets/banner-1.jpg', mobile: '', link: '', active: true }); renderSettings(); },
  banDel: async b => { if (!await confirmBox('حذف هذا البنر؟')) return; const arr = collectBanners().map((x, i) => ({ ...x, id: S.set.banners[i]?.id })); arr.splice(+b.dataset.i, 1); S.set.banners = arr; renderSettings(); },
  banUp: b => moveBanner(+b.dataset.i, -1), banDown: b => moveBanner(+b.dataset.i, 1),
  setSave: b => busy(b, async () => { try { const d = await api('/api/admin/settings', { method: 'PUT', body: gatherSettings() }); S.set = d.settings; toast('تم حفظ الإعدادات', 'ok'); renderSettings(); } catch (ex) { toast(ex.message, 'bad'); } }),
  provCheck: b => busy(b, async () => { try { await api('/api/admin/providers?check=1'); } catch (ex) { toast(ex.message, 'bad'); } vProviders(); }),
  devApprove: async () => { try { await api('/api/admin/devices', { method: 'POST', body: { action: 'approve', device_id: $('#dId').value.trim(), label: $('#dLbl').value } }); toast('تم تفعيل الجهاز', 'ok'); vDevices(); } catch (ex) { toast(ex.message, 'bad'); } },
  devApproveRow: async b => { try { await api('/api/admin/devices', { method: 'POST', body: { action: 'approve', device_id: b.dataset.id, label: b.dataset.l } }); toast('تم تفعيل الجهاز', 'ok'); vDevices(); } catch (ex) { toast(ex.message, 'bad'); } },
  devRevoke: async b => { if (!await confirmBox('إلغاء هذا الجهاز؟ سيُسجَّل خروجه فوراً.', 'إلغاء الجهاز')) return; try { await api('/api/admin/devices', { method: 'POST', body: { action: 'revoke', device_id: b.dataset.id } }); toast('تم', 'ok'); vDevices(); } catch (ex) { toast(ex.message, 'bad'); } }
};
function moveBanner(i, dir) { const arr = collectBanners().map((x, k) => ({ ...x, id: S.set.banners[k]?.id })); const j = i + dir; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; S.set.banners = arr; renderSettings(); }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'A') return;
  if (b.type === 'button' || b.tagName === 'BUTTON') { const f = ACT[b.dataset.act]; if (f) { e.preventDefault(); f(b); } }
});
document.addEventListener('change', async e => {
  if (!e.target.classList.contains('bf')) return;
  const f = e.target.files[0]; if (!f) return; if (f.size > 3 * 1024 * 1024) return toast('الحد الأقصى 3MB', 'bad');
  const row = e.target.closest('.banner'); const data = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(f); });
  try { const d = await api('/api/admin/upload', { method: 'POST', body: { data } }); $('.bi', row).value = d.url; $('img', row).src = d.url; toast('تم رفع الصورة', 'ok'); } catch (ex) { toast(ex.message, 'bad'); }
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (S.session && h !== S.section && SECTIONS.some(s => s[0] === h)) go(h); });
(async () => { try { const d = await api('/api/admin/auth'); if (d.session) await start(d.session); } catch {} })();
</script>
</body>
</html>
